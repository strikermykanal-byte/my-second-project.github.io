<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <form action="action page.php">
    <div class="container">       
<h1>Register </h1>
<p>Sign Up to Your Account</p>

<hr>
<button id="theme-toggle" type="button" class="icon-toggle">
    <i class="fa-solid fa-repeat"></i>
    <span class="toggle-text"></span>
</button>

<label for="email"><b>Email <i class="fa-solid fa-envelope"></i> </b></label>
<input type="text" placeholder="registerform@register.yep" id="email" required>

<label for="psw"><b>Password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Enter password" id="psw" required>


<label for="psw-repeat"><b>Repeat password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Repeat password"  name="psw-repeat" id="psw-repeat" required>
<hr>

<p>By creating an account you agree to our </p> <a href="#"> Terms & Privacy</a>
<button type="submit" class="registerBtn">Register</button>

    </div>
 <div class="container signin">
    <p>Already have an account? <a href="#">Sign in</a></p>
 </div>
    
</form>

<script src="script.js"></script>
</body>
</html>
